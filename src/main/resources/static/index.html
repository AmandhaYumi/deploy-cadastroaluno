<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIAP - Cadastro de Alunos</title>
    <style>
        :root {
            --fiap-pink: #ED145B;
            --fiap-black: #1A1A1A;
            --fiap-white: #FFFFFF;
            --fiap-gray: #F2F2F2;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--fiap-gray);
            color: var(--fiap-black);
        }
        header {
            background-color: var(--fiap-black);
            color: var(--fiap-white);
            padding: 20px;
            text-align: center;
            border-bottom: 5px solid var(--fiap-pink);
        }
        header h1 {
            margin: 0;
            font-size: 24px;
            letter-spacing: 2px;
        }
        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
            background: var(--fiap-white);
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }
        input:focus, select:focus {
            border-color: var(--fiap-pink);
            outline: none;
        }
        button {
            background-color: var(--fiap-pink);
            color: var(--fiap-white);
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #d11250;
        }
        hr {
            border: 0;
            height: 1px;
            background: #ccc;
            margin: 30px 0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: var(--fiap-black);
            color: var(--fiap-white);
        }
        tr:hover {
            background-color: #f9f9f9;
        }
        .message {
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 4px;
            display: none;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>

    <header>
        <h1>👨‍🎓 FIAP - SISTEMA DE ALUNOS</h1>
    </header>

    <div class="container">
        <h2>Cadastrar os Estudantes da FIAP</h2>
        <h3>Com a turma 2TDSPO</h3>
        
        <div id="msgBox" class="message"></div>

        <form id="alunoForm">
            <div class="form-group">
                <label for="rm">RM:</label>
                <input type="text" id="rm" name="rm" placeholder="Ex: 98765" required>
            </div>
            
            <div class="form-group">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" placeholder="Nome do aluno" required>
            </div>

            <div class="form-group">
                <label for="sexo">Sexo:</label>
                <select id="sexo" name="sexo" required>
                    <option value="">Selecione...</option>
                    <option value="F">Feminino</option>
                    <option value="M">Masculino</option>
                    <option value="O">Outro</option>
                </select>
            </div>

            <div class="form-group">
                <label for="dataNascimento">Data de Nascimento:</label>
                <input type="date" id="dataNascimento" name="dataNascimento" required>
            </div>

            <button type="submit">Cadastrar Aluno</button>
        </form>

        <hr>

        <h2>Lista de Alunos</h2>
        <table>
            <thead>
                <tr>
                    <th>RM</th>
                    <th>Nome</th>
                    <th>Sexo</th>
                    <th>Data Nascimento</th>
                </tr>
            </thead>
            <tbody id="tabelaAlunos">
                <!-- Alunos renderizados via JS -->
            </tbody>
        </table>
    </div>

    <script>
        const API_URL = '/api/alunos';

        document.getElementById('alunoForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const aluno = {
                rm: document.getElementById('rm').value,
                nome: document.getElementById('nome').value,
                sexo: document.getElementById('sexo').value,
                dataNascimento: document.getElementById('dataNascimento').value
            };

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(aluno)
                });

                if (response.ok) {
                    showMessage('Aluno cadastrado com sucesso!', 'success');
                    document.getElementById('alunoForm').reset();
                    carregarAlunos();
                } else {
                    showMessage('Erro ao cadastrar aluno. Verifique os dados.', 'error');
                }
            } catch (error) {
                showMessage('Erro de conexão com o servidor.', 'error');
            }
        });

        async function carregarAlunos() {
            try {
                const response = await fetch(API_URL);
                if (response.ok) {
                    const alunos = await response.json();
                    const tbody = document.getElementById('tabelaAlunos');
                    tbody.innerHTML = '';
                    
                    alunos.forEach(aluno => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${aluno.rm}</td>
                            <td>${aluno.nome}</td>
                            <td>${aluno.sexo}</td>
                            <td>${formatDate(aluno.dataNascimento)}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
            } catch (error) {
                console.error('Erro ao carregar lista de alunos', error);
            }
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            const [year, month, day] = dateStr.split('-');
            return `${day}/${month}/${year}`;
        }

        function showMessage(text, type) {
            const msgBox = document.getElementById('msgBox');
            msgBox.textContent = text;
            msgBox.className = `message ${type}`;
            msgBox.style.display = 'block';
            setTimeout(() => {
                msgBox.style.display = 'none';
            }, 4000);
        }

        // Carregar a lista inicial ao abrir a página
        carregarAlunos();
    </script>
    
    <div style="text-align: center; padding: 20px; color: #666; font-size: 14px;">
        Desenvolvido com 🩵 na aula de DevOps (Deploy automatizado com CI/CD!)
    </div>
</body>
</html>
