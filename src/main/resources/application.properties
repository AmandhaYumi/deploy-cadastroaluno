# Azure SQL Database Configuration
spring.datasource.url=${AZURE_SQL_CONNECTIONSTRING:jdbc:sqlserver://SEU_SERVIDOR.database.windows.net:1433;database=SuaDatabase;encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30;}
spring.datasource.username=${AZURE_SQL_USERNAME:seu_usuario}
spring.datasource.password=${AZURE_SQL_PASSWORD:Sua_Senha_Forte!}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true

# Server Config
server.port=8080
